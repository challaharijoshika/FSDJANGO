    {% extends 'website/common/base.html' %}
    {% block title %}Order Confirmed{% endblock %}

    {% block main_content %}
    <style>
    /* Full-screen gradient background */
    body {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Floating card */
    .confirm-card {
        position: relative;
        background: #fff;
        border-radius: 2rem;
        padding: 3rem 2rem;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 1rem 3rem rgba(0,0,0,0.25);
        text-align: center;
        overflow: hidden;
    }

    /* Decorative circles for background effect */
    .confirm-card::before,
    .confirm-card::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        opacity: 0.3;
    }
    .confirm-card::before {
        width: 180px;
        height: 180px;
        background: #ffdd59;
        top: -40px;
        left: -40px;
    }
    .confirm-card::after {
        width: 150px;
        height: 150px;
        background: #ff3860;
        bottom: -30px;
        right: -30px;
    }

    /* Animated check icon */
    .confirm-card .icon {
        font-size: 5rem;
        color: #28a745;
        animation: bounce 1s ease infinite alternate;
    }
    @keyframes bounce {
        from { transform: translateY(0); }
        to { transform: translateY(-15px); }
    }

    /* Buttons */
    .btn-shop {
        border-radius: 2rem;
        padding: 0.75rem 2rem;
        font-weight: 600;
        margin-top: 1.5rem;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-shop:hover {
        transform: translateY(-3px);
        box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.15);
    }

    /* Confetti effect */
    .confetti {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0; left: 0;
        pointer-events: none;
    }
    </style>

    <div class="container">
        <div class="confirm-card">
            <div class="icon mb-3">
                <i class="bi bi-check-circle-fill"></i>
            </div>
            <h1 class="display-5 text-success mb-3">Order Confirmed!</h1>
            <p class="lead mb-2">Thank you for your purchase. Your order has been placed successfully.</p>
            <p class="text-muted mb-4">You will receive an email confirmation shortly.</p>

            <a href="{% url 'product_list' %}" class="btn btn-primary btn-lg btn-shop">
                <i class="bi bi-cart me-2"></i> Continue Shopping
            </a>

            <canvas class="confetti"></canvas>
        </div>
    </div>
    
    {% endblock %}
